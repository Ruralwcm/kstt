<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Basic & Kiểm soát tuân thủ · By HaoDT v1.0</title>
<style>
:root {
  --blue: #1a5276; --blue-light: #2980b9; --red: #e74c3c; --orange: #e67e22;
  --green: #27ae60; --gray: #666; --light: #f5f6fa; --card: #fff;
  --radius: 12px; --shadow: 0 2px 8px rgba(0,0,0,0.08);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',Arial,sans-serif; background:var(--light); color:#1a1a1a; min-height:100vh; }
.hidden { display:none !important; }

/* ---- TOPBAR ---- */
.topbar {
  background: linear-gradient(135deg, var(--blue), var(--blue-light));
  color:#fff; padding:8px 12px; display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:200; box-shadow:0 2px 8px rgba(0,0,0,0.15);
}
.topbar h1 { font-size:15px; font-weight:700; }
.topbar .info { font-size:10px; opacity:0.85; cursor:pointer; white-space:nowrap; }

/* ---- NAV ---- */
.nav-tabs {
  display:flex; gap:3px; background:var(--card); padding:4px; margin:6px 8px 0;
  border-radius:10px; box-shadow:var(--shadow); overflow-x:auto; -webkit-overflow-scrolling:touch;
}
.nav-tab {
  flex:1; min-width:fit-content; padding:9px 10px; border-radius:7px; text-align:center;
  font-size:11px; font-weight:600; cursor:pointer; white-space:nowrap; transition:all .2s;
  color:var(--gray); background:transparent; border:none;
}
.nav-tab.active { background:var(--blue); color:#fff; }
.nav-tab:hover:not(.active) { background:#f0f0f0; }

/* ---- CONTENT ---- */
.main { max-width:1100px; margin:0 auto; padding:6px 8px 60px; }
.iframe-wrap { width:100%; height:calc(100vh - 110px); border:none; border-radius:var(--radius); background:#fff; }

/* ---- LOGIN ---- */
.login-wrap { max-width:400px; margin:40px auto; padding:14px; }
.login-card {
  background:var(--card); border-radius:var(--radius); padding:24px; box-shadow:var(--shadow); text-align:center;
}
.login-card h2 { font-size:18px; color:var(--blue); margin-bottom:6px; }
.login-card .sub { font-size:12px; color:var(--gray); margin-bottom:18px; }
.login-card select {
  width:100%; padding:12px; border:1px solid #ddd; border-radius:8px; font-size:14px; margin-bottom:10px; font-family:inherit;
}
.login-card button {
  width:100%; padding:14px; background:var(--blue-light); color:#fff; border:none;
  border-radius:8px; font-size:15px; font-weight:600; cursor:pointer;
}
.role-tabs { display:flex; gap:6px; margin-bottom:14px; }
.role-tab {
  flex:1; padding:10px; border:2px solid #ddd; border-radius:8px; text-align:center;
  font-size:12px; font-weight:600; cursor:pointer; background:#fff; transition:all .2s;
}
.role-tab.active { border-color:var(--blue-light); background:#ebf5fb; color:var(--blue); }

/* ---- COMPONENTS ---- */
.info-bar {
  background:var(--card); border-radius:var(--radius); padding:10px 14px; margin-bottom:10px;
  box-shadow:var(--shadow); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;
}
.info-bar .title { font-weight:700; font-size:14px; }
.info-bar .sub { font-size:11px; color:var(--gray); }

.kpi-row { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
.kpi-card {
  flex:1; min-width:90px; background:var(--card); border-radius:var(--radius); padding:14px;
  text-align:center; box-shadow:var(--shadow); border-top:3px solid var(--blue);
}
.kpi-card.red { border-top-color:var(--red); }
.kpi-card.orange { border-top-color:var(--orange); }
.kpi-card.green { border-top-color:var(--green); }
.kpi-card .val { font-size:24px; font-weight:800; }
.kpi-card .lbl { font-size:10px; color:var(--gray); margin-top:2px; }

.card {
  background:var(--card); border-radius:var(--radius); padding:14px; margin-bottom:10px;
  box-shadow:var(--shadow);
}
.card h3 { font-size:14px; color:var(--blue); margin-bottom:10px; border-bottom:1px solid #eee; padding-bottom:6px; }

.row-item {
  display:flex; justify-content:space-between; align-items:center; padding:8px 0;
  border-bottom:1px solid #f5f5f5; cursor:pointer;
}
.row-item:hover { background:#f8f9fa; margin:0 -14px; padding:8px 14px; }
.row-item .name { font-size:13px; font-weight:600; }
.row-item .meta { font-size:11px; color:var(--gray); }

.progress-bar { flex:1; height:8px; background:#eee; border-radius:4px; margin:0 10px; overflow:hidden; }
.progress-bar .fill { height:100%; border-radius:4px; transition:width .3s; }

.kstt-list { display:flex; flex-direction:column; gap:8px; }
.kstt-item {
  background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
  overflow:hidden; border-left:4px solid #ddd;
}
.kstt-item.done { border-left-color:var(--green); }
.kstt-item.fail { border-left-color:var(--red); }
.kstt-header {
  padding:12px 14px; display:flex; justify-content:space-between; align-items:center;
  cursor:pointer; border-bottom:1px solid #f0f0f0;
}
.kstt-header .name { font-size:13px; font-weight:600; }
.kstt-header .badge { font-size:11px; }
.badge-todo { color:var(--gray); }
.badge-done { color:var(--green); font-weight:600; }
.badge-fail { color:var(--red); font-weight:600; }
.kstt-body { padding:12px 14px; display:flex; flex-direction:column; gap:10px; }

.sample-img { width:100%; max-height:280px; object-fit:contain; border-radius:8px; border:1px solid #eee; background:#fafafa; }
.standard-text { font-size:12px; color:#333; background:#f8f9fa; padding:10px; border-radius:6px; line-height:1.5; }
.standard-text b { color:var(--blue); }

.capture-box {
  border:2px dashed #ccc; border-radius:8px; padding:20px; text-align:center; cursor:pointer;
  transition:all .2s; background:#fafafa; min-height:80px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.capture-box:hover { border-color:var(--blue-light); background:#f0f7ff; }
.capture-box .icon { font-size:32px; margin-bottom:4px; }
.capture-box .text { font-size:12px; color:var(--gray); }
.capture-box.has-photo { border-color:var(--green); border-style:solid; padding:4px; }
.capture-box.has-photo .icon, .capture-box.has-photo .text { display:none; }
.capture-box.has-photo img { max-width:100%; max-height:250px; border-radius:6px; }

.deviation-input {
  width:100%; padding:10px; border:1px solid #ddd; border-radius:6px;
  font-size:13px; font-family:inherit; resize:vertical; min-height:44px;
}
.deviation-input::placeholder { color:#bbb; }

.btn {
  padding:10px 20px; border:none; border-radius:8px; font-size:13px; font-weight:600;
  cursor:pointer; transition:all .2s; display:inline-flex; align-items:center; gap:4px;
}
.btn-primary { background:var(--blue-light); color:#fff; }
.btn-pass { background:var(--green); color:#fff; }
.btn-fail { background:var(--red); color:#fff; }
.btn-outline { background:#fff; color:var(--blue); border:2px solid var(--blue-light); }
.btn-sm { padding:6px 14px; font-size:12px; }
.btn-block { width:100%; justify-content:center; padding:14px; font-size:15px; }

.review-row { display:flex; gap:8px; flex-wrap:wrap; }
.review-col { flex:1; min-width:46%; border-radius:8px; border:1px solid #eee; }
.review-col .label { font-size:10px; color:var(--gray); padding:4px 8px; background:#f8f9fa; border-radius:8px 8px 0 0; }
.review-col img { width:100%; max-height:220px; object-fit:contain; background:#fafafa; border-radius:0 0 8px 8px; }
.review-actions { display:flex; gap:6px; align-items:center; margin-top:8px; flex-wrap:wrap; }

.verdict { display:inline-block; padding:4px 10px; border-radius:6px; font-size:12px; font-weight:700; }
.verdict-pass { background:#eafaf1; color:var(--green); }
.verdict-fail { background:#fdedec; color:var(--red); }

.toast {
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  background:#333; color:#fff; padding:12px 24px; border-radius:20px; font-size:13px;
  z-index:999; opacity:0; transition:opacity .3s;
}
.toast.show { opacity:1; }
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <h1>📸 Basic & Kiểm soát tuân thủ</h1>
  <span class="info hidden" id="userInfo" onclick="doLogout()"></span>
</div>

<!-- LOGIN -->
<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    <h2>📸 Basic & Kiểm soát tuân thủ</h2>
    <div class="sub">WCM Rural · By HaoDT v1.0</div>
    <div class="role-tabs" id="roleTabs">
      <div class="role-tab active" data-role="CH" onclick="selectRole('CH')">🏪 CH</div>
      <div class="role-tab" data-role="QLKV" onclick="selectRole('QLKV')">👤 QLKV</div>
      <div class="role-tab" data-role="GDV" onclick="selectRole('GDV')">👔 GĐV</div>
      <div class="role-tab" data-role="GDM" onclick="selectRole('GDM')">🏢 GĐM</div>
    </div>
    <div id="loginFormCH"><select id="selCH"><option value="">-- Chọn Cửa Hàng --</option></select></div>
    <div id="loginFormQLKV" class="hidden"><select id="selQLKV"><option value="">-- Chọn QLKV --</option></select></div>
    <div id="loginFormGDV" class="hidden"><select id="selGDV"><option value="">-- Chọn GĐV --</option></select></div>
    <div id="loginFormGDM" class="hidden"><select id="selGDM"><option value="">-- Chọn GĐM --</option></select></div>
    <button onclick="doLogin()">👉 Vào Hệ Thống</button>
    <div style="font-size:10px;color:#aaa;margin-top:8px;">By HaoDT v1.0</div>
  </div>
</div>

<!-- APP -->
<div id="appScreen" class="main hidden">
  <div class="nav-tabs" id="navTabs">
    <div class="nav-tab active" data-page="checkcam" onclick="switchTab('checkcam')">📝 Check Cam</div>
    <div class="nav-tab" data-page="bcha" onclick="switchTab('bcha')">📸 Báo cáo HA</div>
    <div class="nav-tab" data-page="review" onclick="switchTab('review')">✅ Kiểm duyệt</div>
    <div class="nav-tab" data-page="dashboard" onclick="switchTab('dashboard')">📊 Dashboard</div>
    <div class="nav-tab" data-page="master" onclick="switchTab('master')">📋 Đầu mục</div>
  </div>
  
  <!-- CheckCam iframe -->
  <div id="tab-checkcam"><iframe class="iframe-wrap" src="https://ruralwcm.github.io/checkcam/" title="Check Cam"></iframe></div>
  
  <!-- Other tabs content -->
  <div id="tab-bcha" class="hidden"></div>
  <div id="tab-review" class="hidden"></div>
  <div id="tab-dashboard" class="hidden"></div>
  <div id="tab-master" class="hidden"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ========== DATA ==========
const KSTT_ITEMS = [
  { id:'k1', section:'Ngoại thất', name:'1. Mặt tiền & Biển hiệu', standard:'Biển hiệu WCM sáng rõ, không che khuất, đúng màu thương hiệu. Mặt tiền sạch sẽ.', sample:'https://placehold.co/600x400/2980b9/white?text=Mau+Mat+Tien' },
  { id:'k2', section:'Trong CH', name:'2. Kệ Rau - Trưng bày', standard:'Rau xếp gọn gàng theo nhóm, có bảng giá. Không có rau héo/dập.', sample:'https://placehold.co/600x400/27ae60/white?text=Mau+Ke+Rau' },
  { id:'k3', section:'Trong CH', name:'3. Kệ Thịt - Tươi sống', standard:'Thịt bảo quản đúng nhiệt độ. Trưng bày theo loại, có giá niêm yết.', sample:'https://placehold.co/600x400/e74c3c/white?text=Mau+Ke+Thit' },
  { id:'k4', section:'Trong CH', name:'4. Kệ Gạo - Hàng khô', standard:'Gạo xếp theo thương hiệu, có bảng giá. Không bụi, ẩm mốc.', sample:'https://placehold.co/600x400/f39c12/white?text=Mau+Ke+Gao' },
  { id:'k5', section:'Trong CH', name:'5. Showcase - Trưng bày KM', standard:'Hàng KM trưng bày nổi bật, có poster/promo. Sản phẩm còn date.', sample:'https://placehold.co/600x400/8e44ad/white?text=Mau+Showcase+KM' },
  { id:'k6', section:'Trong CH', name:'6. Quầy thu ngân', standard:'Quầy sạch sẽ, gọn gàng. Có bảng giá dịch vụ. Máy POS hoạt động.', sample:'https://placehold.co/600x400/2c3e50/white?text=Mau+Quay+Thu+Ngan' },
  { id:'k7', section:'Kho', name:'7. Kho hàng', standard:'Hàng xếp gọn, FIFO. Không ẩm mốc, có lối đi.', sample:'https://placehold.co/600x400/7f8c8d/white?text=Mau+Kho+Hang' },
  { id:'k8', section:'Vệ sinh', name:'8. Vệ sinh CH', standard:'Sàn sạch, không rác. Thùng rác có nắp đậy.', sample:'https://placehold.co/600x400/16a085/white?text=Mau+Ve+Sinh' },
];

const SAMPLE_STORES = [
  { code:'2797', name:'WM+ HNI TTTM Chợ Sải', gdv:'Phạm Minh Thu', qlkv:'Trần Thu Trang', prov:'TP. Hà Nội', gdm:'Trần Đăng Hảo' },
  { code:'2924', name:'WM+ HNI 391 Ngô Xuân Quảng', gdv:'Phạm Minh Thu', qlkv:'Trần Thu Trang', prov:'TP. Hà Nội', gdm:'Trần Đăng Hảo' },
  { code:'3001', name:'WM+ HNI CT Pháp Vân', gdv:'Tạ Công Nhận', qlkv:'Nguyễn Văn An', prov:'TP. Hà Nội', gdm:'Trần Đăng Hảo' },
  { code:'3150', name:'WM+ HNI Times City', gdv:'Tạ Quốc Huy', qlkv:'Lê Thị Mai', prov:'TP. Hà Nội', gdm:'Trần Đăng Hảo' },
  { code:'3205', name:'WM+ HBN Lương Sơn', gdv:'Dương Tùng', qlkv:'Bùi Thị Tuyền', prov:'Hòa Bình', gdm:'Trần Đăng Hảo' },
  { code:'3300', name:'WM+ SLA Chiềng An', gdv:'Dương Tùng', qlkv:'Trang', prov:'Sơn La', gdm:'Trần Đăng Hảo' },
  { code:'3400', name:'WM+ DBN Tủa Chùa', gdv:'Dương Tùng', qlkv:'Vânnm', prov:'Điện Biên', gdm:'Trần Đăng Hảo' },
  { code:'3500', name:'WM+ TQ Yên Sơn', gdv:'Nguyễn Mạnh Sơn', qlkv:'Nguyễn Văn Hiệp', prov:'Tuyên Quang', gdm:'Trần Đăng Hảo' },
  { code:'3600', name:'WM+ PT Thanh Thủy', gdv:'Hồ Nam', qlkv:'Bùi Thị Tuyền', prov:'Phú Thọ', gdm:'Trần Đăng Hảo' },
];

const QLKV_LIST = [...new Set(SAMPLE_STORES.map(s=>s.qlkv))].sort();
const GDV_LIST = [...new Set(SAMPLE_STORES.map(s=>s.gdv))].sort();
const GDM_LIST = [...new Set(SAMPLE_STORES.map(s=>s.gdm))].sort();

// ========== STATE ==========
const A = { role:'CH', user:null, tab:'checkcam', submissions:{} };

function init() {
  const saved = localStorage.getItem('kstt_state_v2');
  if (saved) { try { A.submissions = JSON.parse(saved).submissions||{}; } catch(e){} }
  SAMPLE_STORES.forEach(s => document.getElementById('selCH').innerHTML += `<option value="${s.code}">${s.code} - ${s.name}</option>`);
  QLKV_LIST.forEach(q => document.getElementById('selQLKV').innerHTML += `<option value="${q}">${q}</option>`);
  GDV_LIST.forEach(g => document.getElementById('selGDV').innerHTML += `<option value="${g}">${g}</option>`);
  GDM_LIST.forEach(m => document.getElementById('selGDM').innerHTML += `<option value="${m}">${m}</option>`);
}
function save() { localStorage.setItem('kstt_state_v2', JSON.stringify({submissions:A.submissions})); }

// ========== AUTH ==========
function selectRole(role) {
  A.role = role;
  document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.role-tab[data-role="${role}"]`).classList.add('active');
  ['CH','QLKV','GDV','GDM'].forEach(r => document.getElementById('loginForm'+r).classList.toggle('hidden', r!==role));
}

function doLogin() {
  const role = A.role; let user = null;
  if (role==='CH') {
    const code = document.getElementById('selCH').value;
    if (!code) return toast('⚠️ Chọn Cửa Hàng');
    const s = SAMPLE_STORES.find(s=>s.code===code);
    if (!s) return toast('Không tìm thấy CH');
    user = {...s, role:'CH'};
  } else if (role==='QLKV') { const n = document.getElementById('selQLKV').value; if(!n) return toast('⚠️ Chọn QLKV'); user={name:n, role:'QLKV'}; }
  else if (role==='GDV') { const n = document.getElementById('selGDV').value; if(!n) return toast('⚠️ Chọn GĐV'); user={name:n, role:'GDV'}; }
  else if (role==='GDM') { const n = document.getElementById('selGDM').value; if(!n) return toast('⚠️ Chọn GĐM'); user={name:n, role:'GDM'}; }
  if (!user) return;
  
  A.user = user;
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('appScreen').classList.remove('hidden');
  document.getElementById('userInfo').classList.remove('hidden');
  document.getElementById('userInfo').textContent = (user.role==='CH'?'🏪 ':'👤 ')+(user.name||user.code);
  
  // Show BCHA tab only for CH
  document.querySelector('.nav-tab[data-page="bcha"]').classList.toggle('hidden', role!=='CH');
  
  // Default: CheckCam tab
  A.tab = 'checkcam';
  resetTabs();
  document.querySelector('.nav-tab[data-page="checkcam"]').classList.add('active');
  showTabContent('checkcam');
}

function doLogout() {
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('appScreen').classList.add('hidden');
  document.getElementById('userInfo').classList.add('hidden');
  A.user = null;
}

function resetTabs() {
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  ['checkcam','bcha','review','dashboard','master'].forEach(id => {
    document.getElementById('tab-'+id).classList.add('hidden');
  });
}

function showTabContent(tab) {
  if (tab === 'checkcam') {
    document.getElementById('tab-checkcam').classList.remove('hidden');
  } else {
    document.getElementById('tab-checkcam').classList.add('hidden');
    const target = document.getElementById('tab-'+tab);
    target.classList.remove('hidden');
    if (tab === 'bcha') buildBCHA(target);
    else if (tab === 'review') buildReview(target);
    else if (tab === 'dashboard') buildDashboard(target);
    else if (tab === 'master') buildMaster(target);
  }
}

function switchTab(tab) {
  A.tab = tab;
  resetTabs();
  document.querySelector(`.nav-tab[data-page="${tab}"]`).classList.add('active');
  showTabContent(tab);
}

// ========== HELPERS ==========
function getScopeStores() {
  const role = A.user.role;
  if (role==='QLKV') return SAMPLE_STORES.filter(s=>s.qlkv===A.user.name);
  if (role==='GDV') return SAMPLE_STORES.filter(s=>s.gdv===A.user.name);
  if (role==='GDM') return SAMPLE_STORES.filter(s=>s.gdm===A.user.name);
  return SAMPLE_STORES;
}

function storeStats(store) {
  const subs = A.submissions[store.code]||{}, m = subs._meta||{};
  const done = KSTT_ITEMS.filter(i=>subs[i.id]&&subs[i.id].photo).length;
  const fail = KSTT_ITEMS.filter(i=>subs[i.id]&&subs[i.id].qlkvVerdict==='fail').length;
  return {done, fail, total:KSTT_ITEMS.length, submitted:done>0, qlkvReviewed:!!m.qlkvReviewed, gdvFinalized:!!m.gdvFinalized, pct:Math.round(done/KSTT_ITEMS.length*100)};
}

// ========== TAB: CHECK CAM (iframe - already loaded) ==========

// ========== TAB: BÁO CÁO HA ==========
function buildBCHA(c) {
  if (A.user.role !== 'CH') { c.innerHTML = '<div style="text-align:center;padding:40px;color:var(--gray);">Tab này dành cho Cửa Hàng.</div>'; return; }
  
  const store = A.user, subs = A.submissions[store.code]||{};
  const done = KSTT_ITEMS.filter(i=>subs[i.id]&&subs[i.id].photo).length;
  
  let html = `<div class="info-bar"><div><div class="title">${store.code} - ${store.name}</div><div class="sub">GĐV: ${store.gdv} · QLKV: ${store.qlkv}</div></div><div style="font-weight:600;color:var(--blue);">📸 ${done}/${KSTT_ITEMS.length}</div></div>`;
  
  [...new Set(KSTT_ITEMS.map(i=>i.section))].forEach(sec => {
    const items = KSTT_ITEMS.filter(i=>i.section===sec);
    html += `<div class="card"><h3>📂 ${sec} (${items.length})</h3><div class="kstt-list">`;
    items.forEach(item => {
      const sub = subs[item.id], hasPhoto = !!(sub&&sub.photo), reviewed = sub&&sub.qlkvVerdict;
      let cls = reviewed ? (sub.qlkvVerdict==='pass'?'done':'fail') : (hasPhoto?'done':'');
      html += `<div class="kstt-item ${cls}">
        <div class="kstt-header" onclick="toggleBody(this)">
          <span class="name">${item.name}</span>
          <span class="badge ${reviewed?(sub.qlkvVerdict==='pass'?'badge-done':'badge-fail'):(hasPhoto?'badge-done':'badge-todo')}">${reviewed?(sub.qlkvVerdict==='pass'?'✅ QLKV Đạt':'❌ Ko đạt'):(hasPhoto?'✅ Đã chụp':'⏳ Chưa chụp')}</span>
        </div>
        <div class="kstt-body" style="display:${hasPhoto?'none':'flex'}">
          <div style="font-size:11px;color:var(--gray);">📷 Ảnh mẫu:</div>
          <img class="sample-img" src="${item.sample}" alt="Mẫu" loading="lazy">
          <div class="standard-text">📋 <b>Tiêu chuẩn:</b> ${item.standard}</div>
          <div style="font-size:11px;color:var(--gray);">📸 Ảnh thực tế:</div>
          <div class="capture-box ${hasPhoto?'has-photo':''}" onclick="capturePhoto('${item.id}')">${hasPhoto?`<img src="${sub.photo}">`:'<div class="icon">📸</div><div class="text">Chạm để chụp</div>'}</div>
          <textarea class="deviation-input" id="dev-${item.id}" placeholder="Ghi chú sai lệch...">${sub?sub.deviation||'':''}</textarea>
        </div></div>`;
    });
    html += `</div></div>`;
  });
  
  html += `<div style="text-align:center;padding:16px 0;"><button class="btn btn-primary btn-block" onclick="submitAll()">📤 Gửi Báo Cáo (${done}/${KSTT_ITEMS.length})</button></div>`;
  c.innerHTML = html;
}

function toggleBody(hdr) { const b = hdr.nextElementSibling; b.style.display = b.style.display==='none'?'flex':'none'; }

function capturePhoto(itemId) {
  const inp = document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.capture='environment';
  inp.onchange = e => {
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let w=img.width, h=img.height, mW=1024, mH=768;
        if(w>mW){h=h*mW/w;w=mW;} if(h>mH){w=w*mH/h;h=mH;}
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        const dataUrl = canvas.toDataURL('image/jpeg',0.7);
        const sc = A.user.code;
        if(!A.submissions[sc]) A.submissions[sc]={};
        if(!A.submissions[sc][itemId]) A.submissions[sc][itemId]={};
        A.submissions[sc][itemId].photo = dataUrl;
        A.submissions[sc][itemId].submittedAt = new Date().toISOString();
        if(!A.submissions[sc]._meta) A.submissions[sc]._meta={qlkvReviewed:false,gdvFinalized:false};
        save();
        switchTab('bcha');
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };
  inp.click();
}

function submitAll() {
  const sc = A.user.code, subs = A.submissions[sc]||{};
  KSTT_ITEMS.forEach(i => { const el = document.getElementById('dev-'+i.id); if(el&&subs[i.id]) subs[i.id].deviation = el.value.trim(); });
  const done = KSTT_ITEMS.filter(i=>subs[i.id]&&subs[i.id].photo).length;
  if(done===0) return toast('⚠️ Vui lòng chụp ít nhất 1 ảnh');
  subs._meta = subs._meta||{}; subs._meta.submittedAt = new Date().toISOString(); subs._meta.qlkvReviewed = false; subs._meta.gdvFinalized = false;
  save();
  toast(`✅ Đã gửi ${done}/${KSTT_ITEMS.length} đầu mục`);
  switchTab('bcha');
}

// ========== TAB: KIỂM DUYỆT ==========
function buildReview(c) {
  const role = A.user.role;
  if (role==='CH') { c.innerHTML = '<div style="text-align:center;padding:40px;color:var(--gray);">Đăng nhập QLKV hoặc GĐV.</div>'; return; }
  
  const stores = getScopeStores();
  let pending=[], done=[];
  stores.forEach(store => {
    const subs = A.submissions[store.code]||{};
    if (!KSTT_ITEMS.some(i=>subs[i.id]&&subs[i.id].photo)) return;
    if (role==='QLKV') { (subs._meta?.qlkvReviewed?done:pending).push(store); }
    else { (subs._meta?.gdvFinalized?done:pending).push(store); }
  });
  
  const label = role==='QLKV'?'duyệt':'chốt';
  let html = `<div class="info-bar"><div><div class="title">${role==='QLKV'?'👤 QLKV':'👔 GĐV'}: ${A.user.name}</div><div class="sub">${stores.length} CH</div></div></div>
    <div class="card"><h3>⏳ Chờ ${label} (${pending.length})</h3>`;
  
  if(pending.length===0) html += '<div style="text-align:center;padding:20px;color:var(--gray);">✅ Không có CH nào chờ</div>';
  else pending.forEach(store => {
    const subs = A.submissions[store.code]||{}, dc = KSTT_ITEMS.filter(i=>subs[i.id]&&subs[i.id].photo).length;
    html += `<div class="row-item" onclick="reviewStore('${store.code}')"><div><div class="name">${store.code} - ${store.name}</div><div class="meta">📸 ${dc}/${KSTT_ITEMS.length}</div></div><span style="color:var(--orange);">⏳ Chờ</span></div>`;
  });
  
  html += `</div><div class="card"><h3>✅ Đã ${label} (${done.length})</h3>`;
  if(done.length===0) html += '<div style="text-align:center;padding:20px;color:var(--gray);">Chưa có</div>';
  else done.forEach(store => { html += `<div class="row-item" onclick="reviewStore('${store.code}')"><div><div class="name">${store.code} - ${store.name}</div><div class="meta">GĐV: ${store.gdv}</div></div><span class="verdict verdict-pass">✅ Đã ${label}</span></div>`; });
  html += `</div>`;
  c.innerHTML = html;
}

function reviewStore(storeCode) {
  const store = SAMPLE_STORES.find(s=>s.code===storeCode), subs = A.submissions[storeCode]||{}, role = A.user.role;
  const c = document.getElementById('tab-review');
  
  let html = `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
    <div><b style="font-size:15px;">${storeCode} - ${store.name}</b><br><span style="font-size:11px;color:var(--gray);">GĐV: ${store.gdv} · QLKV: ${store.qlkv}</span></div>
    <button class="btn btn-outline btn-sm" onclick="switchTab('review')">← Quay lại</button></div>`;
  
  KSTT_ITEMS.forEach(item => {
    const sub = subs[item.id]; if(!sub||!sub.photo) return;
    const isQLKV = role==='QLKV', reviewed = isQLKV?!!sub.qlkvVerdict:!!sub.gdvVerdict;
    
    html += `<div style="margin-bottom:10px;border:1px solid #eee;border-radius:8px;overflow:hidden;">
      <div style="font-weight:600;font-size:12px;padding:8px 12px;background:#f8f9fa;${isQLKV?'':'display:flex;justify-content:space-between;'}">${item.name}${isQLKV?'':'<span style="font-size:10px;">'+(sub.qlkvVerdict?(sub.qlkvVerdict==='pass'?'✅ QLKV Đạt':'❌ QLKV Ko đạt'):'⏳ Chưa duyệt')+'</span>'}</div>
      <div class="review-row" style="padding:8px;">
        <div class="review-col"><div class="label">📷 Mẫu</div><img src="${item.sample}" style="width:100%;height:140px;object-fit:contain;background:#fafafa;" loading="lazy"></div>
        <div class="review-col"><div class="label">📸 Thực tế</div><img src="${sub.photo}" style="width:100%;height:140px;object-fit:contain;background:#fafafa;" loading="lazy"></div></div>
      ${sub.deviation?`<div style="padding:0 12px 4px;font-size:11px;color:var(--orange);">⚠️ CH: ${sub.deviation}</div>`:''}
      ${isQLKV&&sub.qlkvNote?`<div style="padding:0 12px 4px;font-size:11px;color:var(--blue);">📝 ${sub.qlkvNote}</div>`:''}
      ${!isQLKV&&sub.qlkvNote?`<div style="padding:0 12px 4px;font-size:11px;color:var(--blue);">📝 QLKV: ${sub.qlkvNote}</div>`:''}
      ${reviewed ? `<div style="padding:0 12px 8px;"><span class="verdict ${(isQLKV?sub.qlkvVerdict:sub.gdvVerdict)==='pass'?'verdict-pass':'verdict-fail'}">${isQLKV?(sub.qlkvVerdict==='pass'?'✅ Đạt':'❌ Ko đạt'):(sub.gdvVerdict==='pass'?'✅ GĐV chốt Đạt':'❌ GĐV chốt Ko đạt')}</span> ${isQLKV?(sub.qlkvNote||''):(sub.gdvNote||'')}</div>`
        : `<div class="review-actions" style="padding:0 12px 12px;">
            <button class="btn btn-pass btn-sm" onclick="doVerdict('${storeCode}','${item.id}','${isQLKV?'qlkv':'gdv'}','pass')">✅ Đạt</button>
            <button class="btn btn-fail btn-sm" onclick="doVerdict('${storeCode}','${item.id}','${isQLKV?'qlkv':'gdv'}','fail')">❌ Ko đạt</button>
            <input id="vnote-${item.id}" placeholder="Ghi chú" style="flex:1;padding:6px;border:1px solid #ddd;border-radius:6px;font-size:12px;">
          </div>`}
    </div>`;
  });
  html += `<div style="text-align:center;padding:8px;"><button class="btn btn-outline btn-sm" onclick="switchTab('review')">← Quay lại</button></div></div>`;
  c.innerHTML = html;
}

function doVerdict(storeCode, itemId, level, verdict) {
  const subs = A.submissions[storeCode]||{}; if(!subs[itemId]) subs[itemId]={};
  const el = document.getElementById('vnote-'+itemId), note = el?el.value.trim():'';
  if (level==='qlkv') { subs[itemId].qlkvVerdict=verdict; subs[itemId].qlkvNote=note; subs[itemId].qlkvReviewedAt=new Date().toISOString();
    if(KSTT_ITEMS.every(i=>!subs[i.id]||!subs[i.id].photo||!!subs[i.id].qlkvVerdict)&&subs._meta) subs._meta.qlkvReviewed=true; }
  else { subs[itemId].gdvVerdict=verdict; subs[itemId].gdvNote=note; subs[itemId].gdvChotAt=new Date().toISOString();
    if(KSTT_ITEMS.every(i=>!subs[i.id]||!subs[i.id].photo||!!subs[i.id].gdvVerdict)&&subs._meta) subs._meta.gdvFinalized=true; }
  A.submissions[storeCode]=subs; save();
  reviewStore(storeCode);
}

// ========== TAB: DASHBOARD ==========
function buildDashboard(c) {
  const stores = SAMPLE_STORES;
  let tot=stores.length, sub=0, qD=0, gD=0, fail=0;
  stores.forEach(store => { const st=storeStats(store); if(st.submitted)sub++; if(st.qlkvReviewed)qD++; if(st.gdvFinalized)gD++; fail+=st.fail; });
  
  let html = `<div class="kpi-row">
    <div class="kpi-card"><div class="val">${tot}</div><div class="lbl">Tổng CH</div></div>
    <div class="kpi-card orange"><div class="val">${sub}</div><div class="lbl">Đã BC</div></div>
    <div class="kpi-card"><div class="val">${tot-sub}</div><div class="lbl">Chưa BC</div></div>
    <div class="kpi-card green"><div class="val">${qD}</div><div class="lbl">QLKV duyệt</div></div>
    <div class="kpi-card green"><div class="val">${gD}</div><div class="lbl">GĐV chốt</div></div>
    <div class="kpi-card red"><div class="val">${fail}</div><div class="lbl">Ko đạt</div></div></div>`;
  
  html += `<div class="card"><h3>📊 Theo GĐV</h3>`;
  GDV_LIST.forEach(gdv => {
    const gs = SAMPLE_STORES.filter(s=>s.gdv===gdv); let sS=0, sQ=0, sG=0;
    gs.forEach(s=>{ const st=storeStats(s); if(st.submitted)sS++; if(st.qlkvReviewed)sQ++; if(st.gdvFinalized)sG++; });
    html += `<div class="row-item"><div><div class="name">👔 ${gdv}</div><div class="meta">${gs.length} CH</div></div><div style="text-align:right;"><b>${sS}/${gs.length}</b><div style="font-size:10px;color:var(--gray);">QLKV:${sQ} · GĐV:${sG}</div></div></div>`;
  });
  html += `</div>`;
  
  html += `<div class="card"><h3>📋 Chi tiết CH</h3>`;
  stores.forEach(store => {
    const st=storeStats(store);
    let status = st.submitted ? (st.gdvFinalized?'<span class="verdict verdict-pass">✅ Chốt</span>':st.qlkvReviewed?'<span style="color:var(--blue);">✅ QLKV duyệt</span>':'<span style="color:var(--orange);">⏳ Chờ</span>') : '<span style="color:var(--gray);">⏳ Chưa BC</span>';
    html += `<div class="row-item"><div><div class="name">${store.code} - ${store.name}</div><div class="meta">GĐV:${store.gdv} · 📸${st.done}/${st.total}</div></div><div style="display:flex;align-items:center;gap:8px;min-width:120px;"><div class="progress-bar"><div class="fill" style="width:${st.pct}%;background:${st.pct>=80?'var(--green)':st.pct>=50?'var(--orange)':'var(--red)'};"></div></div>${status}</div></div>`;
  });
  html += `</div>`;
  c.innerHTML = html;
}

// ========== TAB: ĐẦU MỤC ==========
function buildMaster(c) {
  const sections = [...new Set(KSTT_ITEMS.map(i=>i.section))];
  let html = `<div class="info-bar"><div><div class="title">📋 Danh mục đầu mục KSTT</div><div class="sub">${KSTT_ITEMS.length} mục · ${sections.length} nhóm</div></div></div>`;
  sections.forEach(sec => {
    const items = KSTT_ITEMS.filter(i=>i.section===sec);
    html += `<div class="card"><h3>📂 ${sec} (${items.length})</h3>`;
    items.forEach(item => {
      html += `<div style="margin-bottom:12px;border:1px solid #eee;border-radius:8px;overflow:hidden;">
        <div style="font-weight:600;font-size:13px;padding:8px 12px;background:#f8f9fa;">${item.name}</div>
        <div style="padding:8px 12px;">
          <div style="font-size:11px;color:var(--gray);margin-bottom:4px;">📷 Ảnh mẫu:</div>
          <img src="${item.sample}" style="width:100%;max-height:200px;object-fit:contain;background:#fafafa;border-radius:6px;" loading="lazy">
          <div class="standard-text" style="margin-top:8px;">📋 ${item.standard}</div></div></div>`;
    });
    html += `</div>`;
  });
  c.innerHTML = html;
}

function toast(msg) { const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2500); }
init();
</script>
