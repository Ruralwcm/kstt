<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Basic & Kiểm soát tuân thủ · By HaoDT v1.0</title>
<style>
:root {
  --blue: #1a5276; --blue-light: #2980b9; --red: #e74c3c; --orange: #e67e22;
  --green: #27ae60; --gray: #666; --bg: #f5f6fa; --card: #fff;
  --radius: 12px; --shadow: 0 2px 8px rgba(0,0,0,0.08);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',Arial,sans-serif; background:var(--bg); color:#1a1a1a; min-height:100vh; }
.hidden { display:none !important; }

.topbar {
  background: linear-gradient(135deg, #1e293b, #334155);
  color:#fff; padding:8px 14px; display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:200; box-shadow:0 2px 8px rgba(0,0,0,0.2);
}
.topbar h1 { font-size:15px; font-weight:700; }
.topbar h1 span.by { font-size:10px; opacity:0.6; font-weight:400; margin-left:4px; white-space:nowrap; }
.topbar h1 .title-text { display:inline; }
@media(max-width:600px){ .topbar h1 .title-text { display:none; } .topbar h1 { font-size:13px; } .topbar { padding:8px 10px; } }
.topbar .actions { display:flex; gap:4px; align-items:center; flex-shrink:0; }
.topbar .actions button, .topbar .actions select {
  padding:5px 8px; border-radius:5px; border:1px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.1); color:#fff; font-size:11px; cursor:pointer; font-family:inherit; max-width:110px;
}
.topbar .actions select option { color:#333; }

.main { max-width:960px; margin:0 auto; padding:12px 14px 60px; }
.sub-page { max-width:960px; margin:0 auto; padding:10px 14px 60px; }
.sub-header {
  display:flex; align-items:center; gap:10px; margin-bottom:12px;
  padding:10px 14px; background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
}
.sub-header .back { font-size:20px; cursor:pointer; color:var(--blue); flex-shrink:0; }
.sub-header .title { font-size:15px; font-weight:700; }

/* ---- COMPONENTS ---- */
.info-bar {
  background:var(--card); border-radius:var(--radius); padding:10px 14px; margin-bottom:10px;
  box-shadow:var(--shadow); display:flex; justify-content:space-between; align-items:center;
}
.info-bar .title { font-weight:700; font-size:13px; }
.info-bar .sub { font-size:11px; color:var(--gray); }

.kpi-row { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
.kpi-card {
  flex:1; min-width:90px; background:var(--card); border-radius:var(--radius); padding:14px;
  text-align:center; box-shadow:var(--shadow); border-top:3px solid var(--blue);
}
.kpi-card.red { border-top-color:var(--red); }
.kpi-card.orange { border-top-color:var(--orange); }
.kpi-card.green { border-top-color:var(--green); }
.kpi-card .val { font-size:24px; font-weight:800; }
.kpi-card .lbl { font-size:10px; color:var(--gray); margin-top:2px; }

.card {
  background:var(--card); border-radius:var(--radius); padding:14px; margin-bottom:10px;
  box-shadow:var(--shadow);
}
.card h3 { font-size:14px; color:var(--blue); margin-bottom:10px; border-bottom:1px solid #eee; padding-bottom:6px; }

.row-item {
  display:flex; justify-content:space-between; align-items:center; padding:8px 0;
  border-bottom:1px solid #f5f5f5; cursor:pointer;
}
.row-item:hover { background:#f8f9fa; margin:0 -14px; padding:8px 14px; }
.row-item .name { font-size:13px; font-weight:600; }
.row-item .meta { font-size:11px; color:var(--gray); }

.progress-bar { flex:1; height:8px; background:#eee; border-radius:4px; margin:0 10px; overflow:hidden; }
.progress-bar .fill { height:100%; border-radius:4px; transition:width .3s; }

.module-grid { display:flex; flex-direction:column; gap:10px; }
.module-card {
  background:var(--card); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow);
  cursor:pointer; transition:all .2s; border-left:5px solid var(--blue);
  display:flex; align-items:center; gap:12px;
}
.module-card:hover { transform:translateY(-1px); box-shadow:0 4px 16px rgba(0,0,0,0.12); }
.module-card:nth-child(1) { border-left-color: var(--blue-light); }
.module-card:nth-child(2) { border-left-color: #6366f1; }
.module-icon { font-size:32px; }
.module-info .name { font-size:15px; font-weight:700; }
.module-info .desc { font-size:12px; color:var(--gray); margin-top:2px; }
.module-arrow { font-size:20px; color:#ccc; margin-left:auto; }

/* BCHA */
.kstt-list { display:flex; flex-direction:column; gap:8px; }
.kstt-item {
  background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
  overflow:hidden; border-left:4px solid #ddd;
}
.kstt-item.done { border-left-color:var(--green); }
.kstt-item.fail { border-left-color:var(--red); }
.kstt-header {
  padding:12px 14px; display:flex; justify-content:space-between; align-items:center;
  cursor:pointer; border-bottom:1px solid #f0f0f0;
}
.kstt-header .name { font-size:13px; font-weight:600; }
.kstt-header .badge { font-size:11px; }
.badge-todo { color:var(--gray); }
.badge-done { color:var(--green); font-weight:600; }
.badge-fail { color:var(--red); font-weight:600; }
.kstt-body { padding:12px 14px; display:none; flex-direction:column; gap:10px; }

.sample-img { width:100%; max-height:260px; object-fit:contain; border-radius:8px; border:1px solid #eee; background:#fafafa; }
.standard-text { font-size:12px; color:#333; background:#f8f9fa; padding:10px; border-radius:6px; line-height:1.5; }
.standard-text b { color:var(--blue); }

.capture-box {
  border:2px dashed #ccc; border-radius:8px; padding:20px; text-align:center; cursor:pointer;
  background:#fafafa; min-height:80px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.capture-box:hover { border-color:var(--blue-light); background:#f0f7ff; }
.capture-box .icon { font-size:32px; margin-bottom:4px; }
.capture-box .text { font-size:12px; color:var(--gray); }
.capture-box.has-photo { border-color:var(--green); border-style:solid; padding:4px; }
.capture-box.has-photo .icon, .capture-box.has-photo .text { display:none; }
.capture-box.has-photo img { max-width:100%; max-height:250px; border-radius:6px; }

.deviation-input {
  width:100%; padding:10px; border:1px solid #ddd; border-radius:6px;
  font-size:13px; font-family:inherit; resize:vertical; min-height:44px;
}

.btn {
  padding:8px 16px; border:none; border-radius:7px; font-size:12px; font-weight:600;
  cursor:pointer; display:inline-flex; align-items:center; gap:4px;
}
.btn-primary { background:var(--blue-light); color:#fff; }
.btn-pass { background:var(--green); color:#fff; }
.btn-fail { background:var(--red); color:#fff; }
.btn-outline { background:#fff; color:var(--blue); border:2px solid var(--blue-light); }
.btn-sm { padding:5px 12px; font-size:11px; }
.btn-block { width:100%; justify-content:center; padding:14px; font-size:15px; }

.review-row { display:flex; gap:8px; flex-wrap:wrap; }
.review-col { flex:1; min-width:46%; border-radius:8px; border:1px solid #eee; }
.review-col .label { font-size:10px; color:var(--gray); padding:4px 8px; background:#f8f9fa; border-radius:8px 8px 0 0; }
.review-col img { width:100%; max-height:200px; object-fit:contain; background:#fafafa; border-radius:0 0 8px 8px; }
.review-actions { display:flex; gap:6px; align-items:center; margin-top:8px; flex-wrap:wrap; }

.verdict { display:inline-block; padding:4px 10px; border-radius:6px; font-size:12px; font-weight:700; }
.verdict-pass { background:#eafaf1; color:var(--green); }
.verdict-fail { background:#fdedec; color:var(--red); }

.iframe-wrap { width:100%; height:calc(100vh - 56px); border:none; background:#fff; }

.toast {
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  background:#333; color:#fff; padding:12px 24px; border-radius:20px; font-size:13px;
  z-index:999; opacity:0; transition:opacity .3s;
}
.toast.show { opacity:1; }
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <h1>📸 KSTT · <span class="title-text">Basic &amp; Kiểm soát tuân thủ</span> <span class="by">By HaoDT v1.0</span></h1>
  <div class="actions" id="topActions">
    <select id="selRole" onchange="onRoleChange()" style="max-width:100px;">
      <option value="">👁️ Xem</option>
      <option value="QLKV">👤 QLKV</option>
      <option value="GDV">👔 GĐV</option>
      <option value="GDM">🏢 GĐM</option>
    </select>
    <select id="selUser" onchange="onUserChange()" style="max-width:140px;display:none;">
      <option value="">-- Chọn --</option>
    </select>
    <button onclick="goHome()" style="font-size:18px;padding:2px 8px;" title="Trang chính">🏠</button>
  </div>
</div>

<!-- MAIN CONTENT -->
<div id="appContent" class="main"></div>

<div class="toast" id="toast"></div>

<script>
// ========== DATA ==========
const KSTT_ITEMS = [
  { id:'k1', section:'Ngoại thất', name:'1. Mặt tiền & Biển hiệu', standard:'Biển hiệu WCM sáng rõ, không che khuất, đúng màu thương hiệu. Mặt tiền sạch sẽ.', sample:'https://placehold.co/600x400/2980b9/white?text=Mau+Mat+Tien' },
  { id:'k2', section:'Trong CH', name:'2. Kệ Rau - Trưng bày', standard:'Rau xếp gọn gàng theo nhóm, có bảng giá. Không có rau héo/dập.', sample:'https://placehold.co/600x400/27ae60/white?text=Mau+Ke+Rau' },
  { id:'k3', section:'Trong CH', name:'3. Kệ Thịt - Tươi sống', standard:'Thịt bảo quản đúng nhiệt độ. Trưng bày theo loại, có giá niêm yết.', sample:'https://placehold.co/600x400/e74c3c/white?text=Mau+Ke+Thit' },
  { id:'k4', section:'Trong CH', name:'4. Kệ Gạo - Hàng khô', standard:'Gạo xếp theo thương hiệu, có bảng giá. Không bụi, ẩm mốc.', sample:'https://placehold.co/600x400/f39c12/white?text=Mau+Ke+Gao' },
  { id:'k5', section:'Trong CH', name:'5. Showcase - Trưng bày KM', standard:'Hàng KM trưng bày nổi bật, có poster/promo. Sản phẩm còn date.', sample:'https://placehold.co/600x400/8e44ad/white?text=Mau+Showcase+KM' },
  { id:'k6', section:'Trong CH', name:'6. Quầy thu ngân', standard:'Quầy sạch sẽ, gọn gàng. Có bảng giá dịch vụ. Máy POS hoạt động.', sample:'https://placehold.co/600x400/2c3e50/white?text=Mau+Quay+Thu+Ngan' },
  { id:'k7', section:'Kho', name:'7. Kho hàng', standard:'Hàng xếp gọn, FIFO. Không ẩm mốc, có lối đi.', sample:'https://placehold.co/600x400/7f8c8d/white?text=Mau+Kho+Hang' },
  { id:'k8', section:'Vệ sinh', name:'8. Vệ sinh CH', standard:'Sàn sạch, không rác. Thùng rác có nắp đậy.', sample:'https://placehold.co/600x400/16a085/white?text=Mau+Ve+Sinh' },
];

const STORES = [
  { code:'2797', name:'WM+ HNI TTTM Chợ Sải', gdv:'Phạm Minh Thu', qlkv:'Trần Thu Trang', prov:'Hà Nội', gdm:'Trần Đăng Hảo' },
  { code:'2924', name:'WM+ HNI 391 Ngô Xuân Quảng', gdv:'Phạm Minh Thu', qlkv:'Trần Thu Trang', prov:'Hà Nội', gdm:'Trần Đăng Hảo' },
  { code:'3001', name:'WM+ HNI CT Pháp Vân', gdv:'Tạ Công Nhận', qlkv:'Nguyễn Văn An', prov:'Hà Nội', gdm:'Trần Đăng Hảo' },
  { code:'3150', name:'WM+ HNI Times City', gdv:'Tạ Quốc Huy', qlkv:'Lê Thị Mai', prov:'Hà Nội', gdm:'Trần Đăng Hảo' },
  { code:'3205', name:'WM+ HBN Lương Sơn', gdv:'Dương Tùng', qlkv:'Bùi Thị Tuyền', prov:'Hòa Bình', gdm:'Trần Đăng Hảo' },
  { code:'3300', name:'WM+ SLA Chiềng An', gdv:'Dương Tùng', qlkv:'Trang', prov:'Sơn La', gdm:'Trần Đăng Hảo' },
  { code:'3400', name:'WM+ DBN Tủa Chùa', gdv:'Dương Tùng', qlkv:'Vânnm', prov:'Điện Biên', gdm:'Trần Đăng Hảo' },
  { code:'3500', name:'WM+ TQ Yên Sơn', gdv:'Nguyễn Mạnh Sơn', qlkv:'Nguyễn Văn Hiệp', prov:'Tuyên Quang', gdm:'Trần Đăng Hảo' },
  { code:'3600', name:'WM+ PT Thanh Thủy', gdv:'Hồ Nam', qlkv:'Bùi Thị Tuyền', prov:'Phú Thọ', gdm:'Trần Đăng Hảo' },
];

const QLKV_LIST = [...new Set(STORES.map(s=>s.qlkv))].sort();
const GDV_LIST = [...new Set(STORES.map(s=>s.gdv))].sort();
const GDM_LIST = [...new Set(STORES.map(s=>s.gdm))].sort();

// ========== STATE ==========
const S = { role:null, user:null, page:'dashboard', viewStore:null, submissions:{} };

function init() {
  const saved = localStorage.getItem('kstt_v4');
  if(saved){ try{S.submissions=JSON.parse(saved).submissions||{}}catch(e){} }
  // Build select
  QLKV_LIST.forEach(q=>document.getElementById('selUser').innerHTML+=`<option class="opt-qlkv" value="QLKV:${q}">${q}</option>`);
  GDV_LIST.forEach(g=>document.getElementById('selUser').innerHTML+=`<option class="opt-gdv" value="GDV:${g}">${g}</option>`);
  GDM_LIST.forEach(m=>document.getElementById('selUser').innerHTML+=`<option class="opt-gdm" value="GDM:${m}">${m}</option>`);
  renderDashboard();
}
function save(){ localStorage.setItem('kstt_v4',JSON.stringify({submissions:S.submissions})); }

// ========== AUTH ==========
function onRoleChange() {
  const role = document.getElementById('selRole').value;
  const selUser = document.getElementById('selUser');
  if (!role) { S.role=null; S.user=null; selUser.style.display='none'; renderDashboard(); return; }
  S.role = role;
  selUser.style.display = 'inline-block';
  // Filter options
  selUser.querySelectorAll('option').forEach(o => {
    const cls = o.className;
    o.style.display = (!cls || cls.includes(role.toLowerCase())) ? '' : 'none';
  });
  selUser.value = '';
  S.user = null;
}

function onUserChange() {
  const val = document.getElementById('selUser').value;
  if (!val) { S.user=null; return; }
  const [role, name] = val.split(':');
  S.role = role; S.user = {name, role};
  document.getElementById('selRole').value = role;
  // stay on current page but may need refresh
}

// ========== NAV ==========
function goHome() { S.page='dashboard'; S.viewStore=null; renderDashboard(); }

function openModule(mod) {
  if (mod === 'bcha') {
    if (!S.user || !S.role) return toast('⚠️ Chọn vai trò & người dùng trước');
    S.page = 'bcha';
    S.viewStore = null;
    renderBCHA();
  } else if (mod === 'checkcam') {
    S.page = 'checkcam';
    renderCheckCam();
  }
}

// ========== RENDER: DASHBOARD ==========
function renderDashboard() {
  const all = STORES;
  let tot=all.length, sub=0, q=0, g=0, f=0;
  all.forEach(st=>{ const s=chStats(st.code); if(s.sub)sub++; if(s.qD)q++; if(s.gD)g++; f+=s.fail; });

  let h = `<div class="kpi-row">
    <div class="kpi-card"><div class="val">${tot}</div><div class="lbl">Tổng CH</div></div>
    <div class="kpi-card orange"><div class="val">${sub}</div><div class="lbl">Đã BC</div></div>
    <div class="kpi-card"><div class="val">${tot-sub}</div><div class="lbl">Chưa BC</div></div>
    <div class="kpi-card green"><div class="val">${q}</div><div class="lbl">QLKV duyệt</div></div>
    <div class="kpi-card green"><div class="val">${g}</div><div class="lbl">GĐV chốt</div></div>
    <div class="kpi-card red"><div class="val">${f}</div><div class="lbl">Ko đạt</div></div></div>`;

  // Module cards
  h += `<div class="module-grid">
    <div class="module-card" onclick="openModule('bcha')">
      <div class="module-icon">📸</div>
      <div class="module-info"><div class="name">KSTT: Báo cáo hình ảnh</div><div class="desc">CH chụp ảnh → QLKV duyệt → GĐV chốt</div></div>
      <div class="module-arrow">→</div>
    </div>
    <div class="module-card" onclick="openModule('checkcam')">
      <div class="module-icon">📝</div>
      <div class="module-info"><div class="name">KSTT: Check Cam</div><div class="desc">Kiểm tra tuân thủ qua camera</div></div>
      <div class="module-arrow">→</div>
    </div>
    <div class="module-card" style="opacity:0.5;cursor:default;">
      <div class="module-icon">📋</div>
      <div class="module-info"><div class="name">KSTT: Khác</div><div class="desc">Đang phát triển</div></div>
    </div>
  </div>`;

  // By GĐV
  h += `<div class="card"><h3>📊 Theo GĐV</h3>`;
  GDV_LIST.forEach(gdv => {
    const gs = STORES.filter(s=>s.gdv===gdv); let sS=0,sQ=0,sG=0;
    gs.forEach(s=>{const st=chStats(s.code);if(st.sub)sS++;if(st.qD)sQ++;if(st.gD)sG++;});
    h += `<div class="row-item"><div><div class="name">👔 ${gdv}</div><div class="meta">${gs.length} CH</div></div><div style="text-align:right;"><b>${sS}/${gs.length}</b><br><span style="font-size:10px;color:var(--gray);">QLKV:${sQ} · GĐV:${sG}</span></div></div>`;
  });
  h += `</div>`;

  // CH detail
  h += `<div class="card"><h3>📋 Chi tiết CH</h3>`;
  all.forEach(st => {
    const s = chStats(st.code);
    let pct = s.pct, bg = pct>=80?'var(--green)':pct>=50?'var(--orange)':'var(--red)';
    let status = s.sub ? (s.gD?'✅':s.qD?'✅QLKV':'⏳') : '⏳';
    h += `<div class="row-item" onclick="openStoreDetail('${st.code}')"><div><div class="name">${st.code} - ${st.name}</div><div class="meta">${st.gdv} · 📸${s.done}/${s.total}</div></div><div style="display:flex;align-items:center;gap:6px;min-width:120px;"><div class="progress-bar"><div class="fill" style="width:${pct}%;background:${bg};"></div></div><span style="font-size:12px;">${status}</span></div></div>`;
  });
  h += `</div>`;

  document.getElementById('appContent').className = 'main';
  document.getElementById('appContent').innerHTML = h;
}

function chStats(code) {
  const subs = S.submissions[code]||{}, m = subs._meta||{};
  const done = KSTT_ITEMS.filter(i=>subs[i.id]&&subs[i.id].photo).length;
  const fail = KSTT_ITEMS.filter(i=>subs[i.id]&&subs[i.id].qlkvVerdict==='fail').length;
  return {done, fail, total:KSTT_ITEMS.length, sub:done>0, qD:!!m.qlkvReviewed, gD:!!m.gdvFinalized, pct:Math.round(done/KSTT_ITEMS.length*100)};
}

// ========== STORE DETAIL (view-only from dashboard) ==========
function openStoreDetail(code) {
  const store = STORES.find(s=>s.code===code);
  const subs = S.submissions[code]||{};
  S.page = 'storeDetail'; S.viewStore = code;
  
  let h = `<div class="sub-header"><span class="back" onclick="goHome()">←</span><span class="title">${code} - ${store.name}</span></div>
    <div style="font-size:12px;color:var(--gray);margin-bottom:12px;">GĐV: ${store.gdv} · QLKV: ${store.qlkv}</div>`;
  
  KSTT_ITEMS.forEach(item => {
    const sub = subs[item.id];
    const hasPhoto = !!(sub&&sub.photo);
    const reviewed = sub&&sub.qlkvVerdict;
    h += `<div class="card"><div style="font-weight:600;font-size:13px;margin-bottom:8px;">${item.name} ${reviewed?'<span class="verdict '+(sub.qlkvVerdict==='pass'?'verdict-pass':'verdict-fail')+'">'+(sub.qlkvVerdict==='pass'?'✅ Đạt':'❌ Ko đạt')+'</span>':hasPhoto?'<span style="color:var(--orange);">⏳ Chờ duyệt</span>':''}</div>`;
    if (hasPhoto) {
      h += `<div class="review-row">
        <div class="review-col"><div class="label">📷 Ảnh mẫu</div><img src="${item.sample}" style="width:100%;height:160px;object-fit:contain;background:#fafafa;" loading="lazy"></div>
        <div class="review-col"><div class="label">📸 Ảnh thực tế</div><img src="${sub.photo}" style="width:100%;height:160px;object-fit:contain;background:#fafafa;" loading="lazy"></div></div>`;
      if(sub.deviation) h += `<div style="font-size:11px;color:var(--orange);margin-top:4px;">⚠️ ${sub.deviation}</div>`;
      if(sub.qlkvNote) h += `<div style="font-size:11px;color:var(--blue);">📝 QLKV: ${sub.qlkvNote}</div>`;
      if(sub.gdvNote) h += `<div style="font-size:11px;color:var(--blue);">📝 GĐV: ${sub.gdvNote}</div>`;
    } else {
      h += `<div style="text-align:center;padding:20px;color:var(--gray);">⏳ Chưa có ảnh</div>`;
    }
    h += `</div>`;
  });
  
  if (S.user && (S.role==='QLKV'||S.role==='GDV'||S.role==='GDM')) {
    h += `<div style="text-align:center;padding:12px;">
      <button class="btn btn-primary" onclick="openModule('bcha');reviewStore('${code}');">✅ Vào Kiểm duyệt</button>
    </div>`;
  }
  
  document.getElementById('appContent').className = 'sub-page';
  document.getElementById('appContent').innerHTML = h;
}

// ========== BCHA MODULE ==========
function renderBCHA() {
  if (S.viewStore) { reviewStore(S.viewStore); return; }
  
  const c = document.getElementById('appContent');
  c.className = 'sub-page';
  
  // Tabs
  let tabs = `<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;">`;
  tabs += `<button class="btn btn-sm ${!S.bchaTab||S.bchaTab==='review'?'btn-primary':''}" onclick="S.bchaTab='review';renderBCHA();">✅ Kiểm duyệt</button>`;
  tabs += `<button class="btn btn-sm ${S.bchaTab==='master'?'btn-primary':''}" onclick="S.bchaTab='master';renderBCHA();">📋 Đầu mục</button>`;
  tabs += `</div>`;
  
  S.bchaTab = S.bchaTab || 'review';
  
  let body = '';
  if (S.bchaTab === 'review') body = buildReviewList();
  else if (S.bchaTab === 'master') body = buildMasterView();
  
  c.innerHTML = `<div class="sub-header"><span class="back" onclick="goHome()">←</span><span class="title">📸 KSTT: Báo cáo hình ảnh</span></div>${tabs}${body}`;
}

function buildReviewList() {
  const role = S.role;
  const stores = role==='QLKV' ? STORES.filter(s=>s.qlkv===S.user.name)
    : role==='GDV' ? STORES.filter(s=>s.gdv===S.user.name)
    : role==='GDM' ? STORES : STORES;
  
  let pending=[], done=[];
  stores.forEach(st => {
    const subs = S.submissions[st.code]||{};
    if (!KSTT_ITEMS.some(i=>subs[i.id]&&subs[i.id].photo)) return;
    if (role==='QLKV') (subs._meta?.qlkvReviewed?done:pending).push(st);
    else (subs._meta?.gdvFinalized?done:pending).push(st);
  });
  
  const label = role==='QLKV'?'duyệt':'chốt';
  let h = `<div class="card"><h3>⏳ Chờ ${label} (${pending.length})</h3>`;
  if(!pending.length) h += '<div style="text-align:center;padding:20px;color:var(--gray);">✅ Không có CH chờ</div>';
  else pending.forEach(st => {
    const dc = KSTT_ITEMS.filter(i=>(S.submissions[st.code]||{})[i.id]&&(S.submissions[st.code]||{})[i.id].photo).length;
    h += `<div class="row-item" onclick="reviewStore('${st.code}')"><div><div class="name">${st.code} - ${st.name}</div><div class="meta">📸 ${dc}/${KSTT_ITEMS.length}</div></div><span style="color:var(--orange);">⏳ Chờ</span></div>`;
  });
  h += `</div><div class="card"><h3>✅ Đã ${label} (${done.length})</h3>`;
  if(!done.length) h += '<div style="text-align:center;padding:20px;color:var(--gray);">Chưa có</div>';
  else done.forEach(st => h += `<div class="row-item" onclick="reviewStore('${st.code}')"><div><div class="name">${st.code} - ${st.name}</div><div class="meta">${st.gdv}</div></div><span class="verdict verdict-pass">✅</span></div>`);
  h += `</div>`;
  return h;
}

function reviewStore(code) {
  S.viewStore = code;
  const store = STORES.find(s=>s.code===code), subs = S.submissions[code]||{}, role = S.role;
  const isQLKV = role==='QLKV';
  const c = document.getElementById('appContent');
  c.className = 'sub-page';
  
  let h = `<div class="sub-header"><span class="back" onclick="S.viewStore=null;renderBCHA()">←</span><span class="title">${code} - ${store.name}</span></div>
    <div style="font-size:12px;color:var(--gray);margin-bottom:12px;">GĐV: ${store.gdv} · QLKV: ${store.qlkv}</div>`;
  
  KSTT_ITEMS.forEach(item => {
    const sub = subs[item.id]; if(!sub||!sub.photo) return;
    const done = isQLKV?!!sub.qlkvVerdict:!!sub.gdvVerdict;
    h += `<div style="margin-bottom:10px;border:1px solid #eee;border-radius:8px;overflow:hidden;">
      <div style="font-weight:600;font-size:12px;padding:8px 12px;background:#f8f9fa;${isQLKV?'':'display:flex;justify-content:space-between;'}">${item.name}${isQLKV?'':'<span style="font-size:10px;">'+(sub.qlkvVerdict?(sub.qlkvVerdict==='pass'?'✅ QLKV Đạt':'❌ QLKV Ko đạt'):'⏳')+'</span>'}</div>
      <div class="review-row" style="padding:8px;">
        <div class="review-col"><div class="label">📷 Mẫu</div><img src="${item.sample}" style="width:100%;height:140px;object-fit:contain;background:#fafafa;" loading="lazy"></div>
        <div class="review-col"><div class="label">📸 Thực tế</div><img src="${sub.photo}" style="width:100%;height:140px;object-fit:contain;background:#fafafa;" loading="lazy"></div></div>
      ${sub.deviation?`<div style="padding:0 12px 4px;font-size:11px;color:var(--orange);">⚠️ ${sub.deviation}</div>`:''}
      ${sub.qlkvNote?`<div style="padding:0 12px 4px;font-size:11px;color:var(--blue);">📝 QLKV: ${sub.qlkvNote}</div>`:''}
      ${done ? `<div style="padding:0 12px 8px;"><span class="verdict ${(isQLKV?sub.qlkvVerdict:sub.gdvVerdict)==='pass'?'verdict-pass':'verdict-fail'}">${(isQLKV?sub.qlkvVerdict:sub.gdvVerdict)==='pass'?'✅ Đạt':'❌ Ko đạt'}</span> ${isQLKV?(sub.qlkvNote||''):(sub.gdvNote||'')}</div>`
        : `<div class="review-actions" style="padding:0 12px 12px;">
            <button class="btn btn-pass btn-sm" onclick="verdict('${code}','${item.id}','${isQLKV?'qlkv':'gdv'}','pass')">✅ Đạt</button>
            <button class="btn btn-fail btn-sm" onclick="verdict('${code}','${item.id}','${isQLKV?'qlkv':'gdv'}','fail')">❌ Ko đạt</button>
            <input id="vnt-${item.id}" placeholder="Ghi chú" style="flex:1;padding:6px;border:1px solid #ddd;border-radius:6px;font-size:12px;">
          </div>`}
    </div>`;
  });
  h += `<div style="text-align:center;padding:8px;"><button class="btn btn-outline btn-sm" onclick="S.viewStore=null;renderBCHA()">← Quay lại</button></div>`;
  c.innerHTML = h;
}

function verdict(code, itemId, level, v) {
  const subs = S.submissions[code]||{}; if(!subs[itemId]) subs[itemId]={};
  const el = document.getElementById('vnt-'+itemId), note = el?el.value.trim():'';
  if(level==='qlkv') { subs[itemId].qlkvVerdict=v; subs[itemId].qlkvNote=note; subs[itemId].qlkvReviewedAt=new Date().toISOString();
    if(KSTT_ITEMS.every(i=>!subs[i.id]||!subs[i.id].photo||!!subs[i.id].qlkvVerdict)&&subs._meta) subs._meta.qlkvReviewed=true; }
  else { subs[itemId].gdvVerdict=v; subs[itemId].gdvNote=note; subs[itemId].gdvChotAt=new Date().toISOString();
    if(KSTT_ITEMS.every(i=>!subs[i.id]||!subs[i.id].photo||!!subs[i.id].gdvVerdict)&&subs._meta) subs._meta.gdvFinalized=true; }
  S.submissions[code]=subs; save();
  reviewStore(code);
}

function buildMasterView() {
  const sections = [...new Set(KSTT_ITEMS.map(i=>i.section))];
  let h = `<div class="info-bar"><div><div class="title">📋 Danh mục đầu mục KSTT</div><div class="sub">${KSTT_ITEMS.length} mục · ${sections.length} nhóm</div></div></div>`;
  sections.forEach(sec => {
    h += `<div class="card"><h3>📂 ${sec}</h3>`;
    KSTT_ITEMS.filter(i=>i.section===sec).forEach(item => {
      h += `<div style="margin-bottom:10px;border:1px solid #eee;border-radius:8px;overflow:hidden;">
        <div style="font-weight:600;font-size:13px;padding:8px 12px;background:#f8f9fa;">${item.name}</div>
        <div style="padding:8px 12px;"><img src="${item.sample}" style="width:100%;max-height:180px;object-fit:contain;background:#fafafa;border-radius:6px;" loading="lazy">
        <div class="standard-text" style="margin-top:6px;">📋 ${item.standard}</div></div></div>`;
    });
    h += `</div>`;
  });
  return h;
}

// ========== CHECKCAM ==========
function renderCheckCam() {
  const c = document.getElementById('appContent');
  c.className = 'sub-page';
  c.innerHTML = `<div class="sub-header"><span class="back" onclick="goHome()">←</span><span class="title">📝 KSTT: Check Cam</span></div>
    <iframe class="iframe-wrap" src="https://ruralwcm.github.io/checkcam/"></iframe>`;
}

function toast(msg) { const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2500); }
init();
</script>
